<h2>Dettaglio del post n. {{ id() }}</h2>

<div class="d-flex gap-2 mb-3">
  <button
    type="button"
    class="btn btn-outline-primary"
    [disabled]="loading() || id() <= 1"
    (click)="precedente()"
  >
    « Precedente
  </button>
  <button
    type="button"
    class="btn btn-outline-primary"
    [disabled]="loading()"
    (click)="successivo()"
  >
    Successivo »
  </button>
  <a class="btn btn-link" routerLink="/posts">Torna all'elenco</a>
</div>

@if (loading()) {
  <div class="spinner-border text-primary" role="status" aria-label="Caricamento"></div>
} @else if (errore(); as e) {
  <div class="alert alert-danger">{{ e }}</div>
} @else if (post(); as p) {
  <div class="card">
    <div class="card-body">
      <h3 class="card-title h5">{{ p.title }}</h3>
      <p class="card-text">{{ p.body }}</p>
      <p class="card-text text-body-secondary">Autore: utente n. {{ p.userId }}</p>
    </div>
  </div>
}
